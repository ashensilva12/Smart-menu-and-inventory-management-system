<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dashboard | The Kings Menu</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .deliver-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:#0f172a; color:#fff; }
        .deliver-header .links a.logout-btn {
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 14px;
            border-radius:10px;
            background: linear-gradient(120deg, #e63946, #ff7b87);
            color:#fff;
            font-weight:700;
            text-decoration:none;
            box-shadow:0 10px 26px rgba(230,57,70,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .deliver-header .links a.logout-btn:hover {
            transform: translateY(-2px);
            box-shadow:0 14px 30px rgba(230,57,70,0.45);
        }
        .deliver-header .links a.logout-btn:active {
            transform: translateY(0);
            box-shadow:0 8px 18px rgba(230,57,70,0.35);
        }
        .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; padding:20px; }
        .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 8px 24px rgba(15,23,42,0.08); display:flex; flex-direction:column; gap:10px; }
        .meta { color:#4b5563; font-size:14px; line-height:1.5; }
        .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; }
        .pill.pending { background:#fff7ed; color:#c2410c; border:1px solid #fdba74; }
        .pill.out_for_delivery { background:#ecfeff; color:#0ea5e9; border:1px solid #7dd3fc; }
        .pill.delivered { background:#ecfdf3; color:#15803d; border:1px solid #86efac; }
        .pill.cancelled { background:#fef2f2; color:#b91c1c; border:1px solid #fecdd3; }
        .actions { display:flex; gap:8px; flex-wrap:wrap; }
        .actions button { border:none; border-radius:10px; padding:8px 12px; font-weight:600; cursor:pointer; }
        .btn-out { background:#0ea5e9; color:#fff; }
        .btn-done { background:#16a34a; color:#fff; }
        .empty { text-align:center; padding:40px; color:#6b7280; }
    </style>
</head>
<body>
    <header class="deliver-header">
        <div>
            <div style="font-size:18px; font-weight:700;">Delivery Dashboard</div>
            <div style="font-size:13px; color:#cbd5e1;">Your assigned orders</div>
        </div>
        <div class="links">
            <a class="logout-btn" href="delivery_login.php?logout=1">Logout</a>
        </div>
    </header>

    <main>
        <section class="cards" id="orders"></section>
        <div class="empty" id="empty" style="display:none;">No orders assigned yet.</div>
    </main>

    <script>
    const ordersEl = document.getElementById('orders');
    const emptyEl = document.getElementById('empty');

    function pill(status) {
        const cls = status || 'pending';
        return `<span class="pill ${cls}">${cls.replace(/_/g,' ')}</span>`;
    }

    function renderOrders(list) {
        if (!list.length) {
            ordersEl.innerHTML = '';
            emptyEl.style.display = 'block';
            return;
        }
        emptyEl.style.display = 'none';
        ordersEl.innerHTML = list.map(o => {
            const addr = o.address ? `<div><strong>Address:</strong> ${o.address}</div>` : '';
            const phone = o.phone ? `<div><strong>Phone:</strong> ${o.phone}</div>` : '';
            const email = o.email ? `<div><strong>Email:</strong> ${o.email}</div>` : '';
            const delivery = o.delivery || { status: 'pending' };
            return `
                <article class="card" data-id="${o.orderID}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:700; font-size:16px;">Order #${o.orderID}</div>
                            <div class="meta">${o.customer || 'Guest'} · ${o.orderType || 'Pickup'}</div>
                        </div>
                        ${pill(delivery.status)}
                    </div>
                    <div class="meta">
                        <div><strong>Items:</strong> ${o.items}</div>
                        <div><strong>Total:</strong> Rs.${Number(o.total || 0).toFixed(2)}</div>
                        ${addr}
                        ${phone}
                        ${email}
                    </div>
                    <div class="actions">
                        ${delivery.status === 'pending' ? `<button class="btn-out" data-action="out">Start delivery</button>` : ''}
                        ${delivery.status !== 'delivered' ? `<button class="btn-done" data-action="delivered">Mark delivered</button>` : ''}
                    </div>
                </article>
            `;
        }).join('');

        ordersEl.querySelectorAll('button[data-action]').forEach(btn => {
            btn.addEventListener('click', () => {
                const card = btn.closest('.card');
                const orderId = Number(card.dataset.id);
                const action = btn.dataset.action === 'out' ? 'out_for_delivery' : 'delivered';
                updateStatus(orderId, action, btn);
            });
        });
    }

    let isLoading = false;

    async function loadOrders() {
        if (isLoading) return;
        isLoading = true;
        ordersEl.innerHTML = '<div class="empty">Loading…</div>';
        try {
            const res = await fetch('delivery_api.php?action=list_my_orders');
            const data = await res.json();
            if (!data.success) throw new Error(data.message || 'Failed to load');
            renderOrders(data.orders || []);
        } catch (err) {
            ordersEl.innerHTML = `<div class="empty">${err.message}</div>`;
        } finally {
            isLoading = false;
        }
    }

    async function updateStatus(orderId, status, btn) {
        btn.disabled = true;
        try {
            const res = await fetch('delivery_api.php?action=update_delivery_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId, status })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.message || 'Update failed');
            await loadOrders();
        } catch (err) {
            alert(err.message);
        } finally {
            btn.disabled = false;
        }
    }

    // Auto-refresh assigned orders every 15s without full page reload
    setInterval(() => { if (!isLoading) loadOrders(); }, 15000);

    loadOrders();
    </script>
</body>
</html>
