</head>
<body>

        <nav class="utility-links">
            <a href="admin_dashboard.php">Dashboard</a>
            <a href="admin_inventory.php">Inventory</a>
        </nav>
    </header>
        <div class="modal" id="add-inventory-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Order Inventory Item</h3>
                <a href="admin_inventory.php">
                    <button class="close-modal">&times;</button>
                </a>
            </div>
        <div class="modal-body">
        <form id="add-inventory-form" action="order.php" method="POST">
            <div id="items-container">
                <div class="order-item" data-index="0">
                    <div class="form-group">
                        <label>Item ID</label>
                        <input type="text" name="itemID[]" required>
                    </div>
                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" name="itemname[]" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select name="category[]" required>
                                <option value="">Select Category</option>
                                <option value="meat">Meat</option>
                                <option value="vegetables">Vegetables</option>
                                <option value="dairy">Dairy</option>
                                <option value="beverages">Beverages</option>
                                <option value="dry-goods">Dry Foods</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Unit</label>
                            <select name="unit[]" required>
                                <option value="">Select Unit</option>
                                <option value="kg">Kilograms (kg)</option>
                                <option value="g">Grams (g)</option>
                                <option value="l">Liters (l)</option>
                                <option value="ml">Milliliters (ml)</option>
                                <option value="pcs">Pieces</option>
                                <option value="bottles">Bottles</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Needed Stock</label>
                            <input type="number" name="stock[]" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>&nbsp;</label>
                            <button type="button" class="btn btn-secondary remove-item" aria-label="Remove item">Remove</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="add-item">Add Another Item</button>
            </div>
            <div class="form-group">
                <label>Supplier Email</label>
                <input type="email" name="supplier" placeholder="supplier@example.com" required>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea name="notes" rows="3" placeholder="Any extra instructions for this order"></textarea>
            </div>
            <div class="form-actions">
                <button type="reset" class="btn btn-secondary close-modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Send Order</button>
            </div>
        </form>
                <a href="admin_inventory.php">
                    <button class="btn btn-back" id="add-inventory-item" >
                        Go Back
                    </button>
                </a>
            </div>
        </div>
    </div>
    <script>
        const form = document.getElementById('add-inventory-form');
        const itemsContainer = document.getElementById('items-container');
        const addItemBtn = document.getElementById('add-item');

        function addItemRow(prefill) {
            const wrapper = document.createElement('div');
            wrapper.className = 'order-item';
            wrapper.innerHTML = `
                <div class="form-group">
                    <label>Item ID</label>
                    <input type="text" name="itemID[]" required>
                </div>
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" name="itemname[]" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select name="category[]" required>
                            <option value="">Select Category</option>
                            <option value="meat">Meat</option>
                            <option value="vegetables">Vegetables</option>
                            <option value="dairy">Dairy</option>
                            <option value="beverages">Beverages</option>
                            <option value="dry-goods">Dry Foods</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Unit</label>
                        <select name="unit[]" required>
                            <option value="">Select Unit</option>
                            <option value="kg">Kilograms (kg)</option>
                            <option value="g">Grams (g)</option>
                            <option value="l">Liters (l)</option>
                            <option value="ml">Milliliters (ml)</option>
                            <option value="pcs">Pieces</option>
                            <option value="bottles">Bottles</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Needed Stock</label>
                        <input type="number" name="stock[]" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <button type="button" class="btn btn-secondary remove-item" aria-label="Remove item">Remove</button>
                    </div>
                </div>
            `;

            const inputs = wrapper.querySelectorAll('input');
            const selects = wrapper.querySelectorAll('select');

            if (prefill) {
                inputs[0].value = prefill.id || '';
                inputs[1].value = prefill.name || '';
                selects[0].value = prefill.cat ? prefill.cat.toLowerCase() : '';
                selects[1].value = prefill.unit ? prefill.unit.toLowerCase() : '';
                inputs[2].value = prefill.qty || '';
            }

            itemsContainer.appendChild(wrapper);
        }

        itemsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('remove-item')) {
                const row = e.target.closest('.order-item');
                if (itemsContainer.children.length === 1) return; // keep at least one row
                row.remove();
            }
        });

        addItemBtn.addEventListener('click', () => addItemRow());

        form.addEventListener('submit', (e) => {
            if (!form.reportValidity()) {
                e.preventDefault();
                return;
            }
            const ok = confirm('Send this order request now? This will email the supplier with all listed items.');
            if (!ok) {
                e.preventDefault();
            }
        });

        // Prefill from low-stock selection if present
        const prefillRaw = sessionStorage.getItem('prefillOrderItems');
        if (prefillRaw) {
            try {
                const prefillItems = JSON.parse(prefillRaw);
                if (Array.isArray(prefillItems) && prefillItems.length) {
                    itemsContainer.innerHTML = '';
                    prefillItems.forEach(item => addItemRow(item));
                }
            } catch (err) {
                console.warn('Prefill parse error', err);
            } finally {
                sessionStorage.removeItem('prefillOrderItems');
            }
        }
    </script>
</body>
</html>
