<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Restaurant Menu</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="auth.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-content">
            <div class="auth-brand">The Kings<span>Menu</span></div>
            <div id="error-message" class="error-message"></div>
            <form action="Loggin.php" method="POST" id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="auth-btn">Login</button>
            </form>
            <div class="auth-links">
                New here? <a href="register.html">Create an account</a>
            </div>
        </div>
    </main>
    <script>
        const loginForm = document.getElementById('login-form');
        const errorBox = document.getElementById('error-message');
        loginForm.addEventListener('submit', (e) => {
            errorBox.textContent = '';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                e.preventDefault();
                errorBox.textContent = 'Please fill in all fields';
            }
        });
    </script>
</body>
</html>
