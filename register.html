<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register | Restaurant</title>
        <link rel="stylesheet" href="theme.css">
        <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-content">
            <div class="auth-brand">The Kings<span>Menu</span></div>
            <p class="auth-sub">Create your account to save favorites and checkout faster.</p>
            
            <div id="error-message" class="error-message"></div>
            
            <form action="register.php" method="POST" id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                    <div class="helper-text">Use 6+ characters with a mix of letters and numbers.</div>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
                </div>
                
                <button type="submit" class="auth-btn">Create account</button>
            </form>
            
            <div class="auth-links">
                Already have an account? <a href="Loggin.html">Login here</a>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('register-form');
        const errorBox = document.getElementById('error-message');

        form.addEventListener('submit', (e) => {
            errorBox.textContent = '';
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!name || !email || !password || !confirmPassword) {
                e.preventDefault();
                errorBox.textContent = 'Please fill in all fields';
                return;
            }
            if (password !== confirmPassword) {
                e.preventDefault();
                errorBox.textContent = 'Passwords do not match';
                return;
            }
            if (password.length < 6) {
                e.preventDefault();
                errorBox.textContent = 'Password must be at least 6 characters';
            }
        });
    </script>
</body>
</html>
