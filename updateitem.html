<body>

    <div class="utility-brand">The Kings Menu</div>
    <nav class="utility-links">
      <a href="admin_dashboard.php">Dashboard</a>
      <a href="admin_inventory.php">Inventory</a>
    </nav>
  </header>
  <div class="two-col">
    <div class="pane stock-pane">

      <div class="inventory-table" style="max-height:520px; overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>

            </tr>
          </thead>
          <tbody id="inventory-list">
            <tr><td colspan="4" style="padding:10px; text-align:center;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="modal form-pane" id="add-inventory-modal">
      <div class="modal-content">

          <a href="admin_inventory.php">
            <button class="close-modal">&times;</button>

        </div>
        <div class="modal-body">

          <div id="items-container">

              <div class="form-group">
                <label>Item ID</label>
                <input type="text" name="itemID[]" required />

              <div class="form-group">
                <label>Item Name</label>
                <input type="text" name="itemname[]" required />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Category</label>
                  <select name="category[]" required>
                    <option value="">Select Category</option>
                    <option value="meat">Meat</option>
                    <option value="vegetables">Vegetables</option>
                    <option value="dairy">Dairy</option>
                    <option value="beverages">Beverages</option>
                    <option value="dry-goods">Dry Foods</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Used Stock</label>
                  <input type="number" name="stock[]" min="0" step="0.01" required />

                <div class="form-group">
                  <label>&nbsp;</label>

            <button type="submit" class="btn btn-primary">Update Items</button>
          </div>
        </form>
          <a href="admin_inventory.php">
          <button class="btn btn-back" id="add-inventory-item">Go Back</button>
        </a>
      </div>
    </div>
  </div>
  </div>
</body>
<script>
  const esc = (s = '') => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));

  const itemsContainer = document.getElementById('items-container');
  const addItemBtn = document.getElementById('add-item');
  const form = document.getElementById('update-form');

  function setRowValues(wrapper, prefill) {
    const inputs = wrapper.querySelectorAll('input');
    const selects = wrapper.querySelectorAll('select');
    if (!prefill) return;
    if (inputs[0]) inputs[0].value = prefill.id || '';
    if (inputs[1]) inputs[1].value = prefill.name || '';
    if (selects[0]) selects[0].value = (prefill.cat || '').toLowerCase();
  }

  function addRow(prefill) {
    const wrapper = document.createElement('div');
    wrapper.className = 'order-item';
    wrapper.innerHTML = `
      <div class="form-group">
        <label>Item ID</label>
        <input type="text" name="itemID[]" required />
      </div>
      <div class="form-group">
        <label>Item Name</label>
        <input type="text" name="itemname[]" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select name="category[]" required>
            <option value="">Select Category</option>
            <option value="meat">Meat</option>
            <option value="vegetables">Vegetables</option>
            <option value="dairy">Dairy</option>
            <option value="beverages">Beverages</option>
            <option value="dry-goods">Dry Foods</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Used Stock</label>
          <input type="number" name="stock[]" min="0" step="0.01" required />
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <button type="button" class="btn btn-secondary remove-item">Remove</button>
        </div>
      </div>
    `;
    itemsContainer.appendChild(wrapper);
    if (prefill) {
      setRowValues(wrapper, prefill);
    }
    return wrapper;
  }

  itemsContainer.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-item')) {
      const row = e.target.closest('.order-item');
      if (itemsContainer.children.length === 1) return;
      row.remove();
    }
  });

  addItemBtn.addEventListener('click', addRow);

  form.addEventListener('submit', (e) => {
    if (!form.reportValidity()) {
      e.preventDefault();
      return;
    }
  });

  // Load full inventory list for quick reference
  fetch('inventory.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'checkstock=all&category=all&search='
  })
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString('<table><tbody>' + html + '</tbody></table>', 'text/html');
    const rows = Array.from(doc.querySelectorAll('tbody tr'));
    const trimmed = rows.map(r => {
      const cells = r.querySelectorAll('td');
      if (cells.length < 5) return null;
      const id = esc(cells[0].textContent.trim());
      const name = esc(cells[1].textContent.trim());
      const cat = esc(cells[2].textContent.trim());
      const stock = esc(cells[3].textContent.trim());
      const unit = esc(cells[4].textContent.trim());
      return `<tr data-id="${id}" data-name="${name}" data-cat="${cat}" data-unit="${unit}" data-stock="${stock}"><td>${id}</td><td>${name}</td><td class=\"right\">${stock}</td><td>${unit}</td></tr>`;
    }).filter(Boolean).join('');
    document.getElementById('inventory-list').innerHTML = trimmed || '<tr><td colspan="4" style="padding:10px; text-align:center;">No items found</td></tr>';
  })
  .catch(() => {
    document.getElementById('inventory-list').innerHTML = '<tr><td colspan="4" style="padding:10px; text-align:center;">Failed to load items</td></tr>';
  });

  // Click-to-prefill from stock list
  document.getElementById('inventory-list').addEventListener('click', (e) => {
    const row = e.target.closest('tr');
    if (!row || !row.dataset.id) return;
    const prefill = {
      id: row.dataset.id,
      name: row.dataset.name,
      cat: row.dataset.cat
    };
    const emptyRow = Array.from(itemsContainer.querySelectorAll('.order-item')).find(r => {
      const idInput = r.querySelector('input[name="itemID[]"]');
      return idInput && !idInput.value.trim();
    });
    const target = emptyRow || addRow(prefill);
    setRowValues(target, prefill);
  });
</script>
</html>
