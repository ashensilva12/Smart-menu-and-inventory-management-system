<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen | Orders</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background: #0b1221; color: #e5e7eb; padding: 24px; }
    .page { max-width: 1200px; margin: 0 auto; }
    .card { background: #101827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; box-shadow: 0 12px 28px rgba(0,0,0,0.32); }
    h1 { margin: 0 0 6px 0; }
    .hint { color: #9ca3af; font-size: 13px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #1f2937; }
    th { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #cbd5e1; background: #0f172a; }
    .pill { display: inline-flex; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: capitalize; }
    .pill.placed { background: rgba(148,163,184,0.15); color: #e2e8f0; }
    .pill.preparing { background: rgba(250,204,21,0.18); color: #facc15; }
    .pill.ready { background: rgba(59,130,246,0.18); color: #93c5fd; }
    .pill.completed { background: rgba(34,197,94,0.18); color: #86efac; }
    select { background: #0f172a; color: #e5e7eb; border: 1px solid #1f2937; border-radius: 8px; padding: 8px; }
    button { border: none; border-radius: 10px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
    .btn-finish { background: #16a34a; color: #fff; }
    .btn-refresh {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #fff;
      margin-left: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      border:1px solid rgba(255,255,255,0.06);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-refresh:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,0.32); }
    .btn-refresh:active { transform: translateY(0); box-shadow: 0 10px 20px rgba(0,0,0,0.28); }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div>
        <h1>Kitchen Orders</h1>
        <div class="hint">See all orders and mark them finished after preparation.</div>
      </div>
      <div>
        <button class="btn-refresh" id="refresh-btn">Refresh</button>
        <a href="admin_dashboard.php" class="btn-refresh">Back</a>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Type</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Updated</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="kitchen-body"><tr><td colspan="8">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

<script>
const bodyEl = document.getElementById('kitchen-body');
const refreshBtn = document.getElementById('refresh-btn');
const statusOptions = ['placed','preparing','ready','completed'];
const LS_KEY = 'kitchen-local-status';
let isLoading = false;
let currentOrders = [];
let localStatus = loadLocalStatus(); // holds kitchen-only status selections

function loadLocalStatus() {
  try {
    return JSON.parse(sessionStorage.getItem(LS_KEY) || '{}');
  } catch (err) {
    return {};
  }
}

function saveLocalStatus() {
  sessionStorage.setItem(LS_KEY, JSON.stringify(localStatus));
}

function pill(status) {
  const cls = statusOptions.includes(status) ? status : 'placed';
  return `<span class="pill ${cls}">${cls}</span>`;
}

async function loadOrders() {
  if (isLoading) return;
  isLoading = true;
  bodyEl.innerHTML = '<tr><td colspan="8">Loading...</td></tr>';
  try {
    const res = await fetch('orders_list.php');
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Failed to load');
    render(data.orders || []);
  } catch (err) {
    bodyEl.innerHTML = `<tr><td colspan="8">${err.message}</td></tr>`;
  } finally {
    isLoading = false;
  }
}

function render(orders = currentOrders) {
  currentOrders = orders;
  if (!orders.length) {
    bodyEl.innerHTML = '<tr><td colspan="8">No orders yet.</td></tr>';
    return;
  }
  bodyEl.innerHTML = orders.map(o => {
    const effectiveStatus = localStatus[o.orderID] || o.status;
    const updated = o.updatedAt ? new Date(o.updatedAt).toLocaleString() : '—';
    const statusSel = statusOptions.map(s => `<option value="${s}" ${s===effectiveStatus?'selected':''}>${s}</option>`).join('');
    return `
      <tr data-id="${o.orderID}">
        <td>#${o.orderID}</td>
        <td>${o.customer || 'Guest'}</td>
        <td>${o.orderType || 'Pickup'}</td>
        <td>${o.items}</td>
        <td>Rs.${Number(o.total||0).toFixed(2)}</td>
        <td>${pill(effectiveStatus)}</td>
        <td>${updated}</td>
        <td style="display:flex; gap:6px; align-items:center;">
          <select class="status-select" data-local="true">${statusSel}</select>
          <button class="btn-finish" data-local="true">Finished</button>
        </td>
      </tr>
    `;
  }).join('');
}

bodyEl.addEventListener('change', (e) => {
  if (!e.target.classList.contains('status-select')) return;
  const row = e.target.closest('tr');
  if (!row) return;
  const id = row.getAttribute('data-id');
  localStatus[id] = e.target.value;
  saveLocalStatus();
  render();
});

bodyEl.addEventListener('click', (e) => {
  if (!e.target.classList.contains('btn-finish')) return;
  const row = e.target.closest('tr');
  if (!row) return;
  const id = row.getAttribute('data-id');
  localStatus[id] = 'completed';
  saveLocalStatus();
  render();
});

refreshBtn.addEventListener('click', loadOrders);
setInterval(() => { if (!isLoading) loadOrders(); }, 15000);
loadOrders();
</script>
</body>
</html>
