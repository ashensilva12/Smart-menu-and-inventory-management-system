<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | The Kings Menu</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-content">
            <div class="auth-brand">The Kings<span>Menu</span></div>
            <p class="auth-sub">Admin access for managing menus, orders, and users.</p>
            <div id="error-message" class="error-message"></div>
            <form action="admin_login.php" method="POST" id="login-form">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="auth-btn">Login</button>
            </form>
            <div class="auth-links">
                <a href="Loggin.html">Back to customer login</a>
            </div>
        </div>
    </main>
    <script>
        const loginForm = document.getElementById('login-form');
        const errorBox = document.getElementById('error-message');
        loginForm.addEventListener('submit', (e) => {
            errorBox.textContent = '';
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if (!user || !pass) {
                e.preventDefault();
                errorBox.textContent = 'Please fill in all fields';
            }
        });
    </script>
</body>
</html>
